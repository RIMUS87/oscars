<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mirror Text Example</title>
</head>
<body>

    <label for="sourceInput">Type something:</label>
    <input type="text" id="sourceInput" placeholder="Type here...">

    <p>Mirrored text: <span id="mirrorTarget"></span></p>

    <script>
        const input = document.getElementById('sourceInput');
        const target = document.getElementById('mirrorTarget');

        input.addEventListener('input', function() {
            target.textContent = input.value;
        });
    </script>

</body>
</html>
